name: Auto Episode

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）自动生成一期预览播客
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target_topic:
        description: AI 选题主题（留空则按热点聚类自动选题）
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: auto-episode
  cancel-in-progress: false

jobs:
  auto-episode:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PODFLOW_LLM_PROVIDER: gemini
      PODFLOW_LLM_MODEL: gemini-2.5-flash
      PODFLOW_TTS_ENGINE: edge-tts
      PODFLOW_TTS_VOICE: zh-CN-XiaoxiaoNeural
      PODFLOW_TARGET_TOPIC: ${{ inputs.target_topic }}
      # Key-free RSS feeds: the reliability baseline for CI. NewsNow / AI-news
      # aggregators are supplementary and may be unreachable from GitHub runners.
      PODFLOW_RSS_URLS: "https://www.ithome.com/rss/,https://www.solidot.org/index.rss"
      PODFLOW_FETCH_SOURCES: "rss,newsnow,ai_news_daily"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install dependencies
        run: |
          npm ci
          npm run setup

      - name: Run auto episode
        run: node scripts/python313.js scripts/run_auto_episode.py --output out/auto-episode

      - name: Upload automated episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podflow-auto-episode
          # 整包上传：final.mp3 + play.html（本地播放器）+ facts/script/state/run_report.json。
          # GitHub 网页不内置音频流播放，下载 zip 后打开 play.html 即可播放。
          path: out/auto-episode/
          if-no-files-found: error
