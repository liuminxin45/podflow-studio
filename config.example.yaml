# PodFlow Studio 配置示例
# 默认路径固定为：PodFlow 晨报的单人新闻早报内容生产。
# 复制为 config.yaml 后可按需替换真实 LLM / TTS provider。

preset:
  id: "morning_news_brief"
  content_type: "news_brief"
  num_hosts: 1
  target_duration_minutes: 14
  target_duration_minutes_range: "12-15"
  template_variant: "quick_6_plus_deep_1"
  recommended_news_item_count: 7
  quick_news_recommended_count: 6
  deep_dive_recommended_count: 1
  allow_custom_news_item_count: false
  tone: "clear, concise, commute-friendly"
  language: "zh-CN"
  segment_plan:
    - type: opening
      count: 1
      target_seconds: [45, 60]
    - type: quick_news
      recommended_count: 6
      target_seconds: [45, 65]
    - type: deep_dive
      recommended_count: 1
      target_seconds: [300, 420]
    - type: closing
      count: 1
      target_seconds: [15, 25]

fetch:
  sources:
    - type: rss
      url: "https://hnrss.org/frontpage"
  max_items_per_source: 10
  timeout: 30

preprocess:
  min_content_length: 80
  max_content_length: 50000
  remove_duplicates: true
  similarity_threshold: 0.85

# 成稿阶段内部节点：素材分析
research:
  enable_web_search: false
  max_search_results: 5
  llm_model: "gpt-4o-mini"
  api_key: ""
  api_base: ""
  temperature: 0.5

# 成稿阶段内部节点：结构确认
topic_selection:
  min_cluster_size: 2
  max_topics: 1
  use_llm_scoring: false
  llm_model: "gpt-4o-mini"
  api_key: ""
  api_base: ""
  temperature: 0.3

facts:
  max_facts: 20
  selected_topic_count: 7

# 成稿阶段内部节点：口播稿生成
script:
  preset_id: "morning_news_brief"
  content_type: "news_brief"
  target_duration_minutes: 14
  num_hosts: 1
  recommended_news_item_count: 7
  quick_news_recommended_count: 6
  deep_dive_recommended_count: 1
  quick_news_chars_min: 220
  quick_news_chars_max: 300
  deep_dive_chars_min: 1200
  deep_dive_chars_max: 1600
  episode_chars_min: 3000
  episode_chars_max: 3800
  tone: "clear, concise, commute-friendly"
  language: "zh-CN"
  require_approval: true
  words_per_minute: 240
  llm_model: "gpt-4o"
  api_key: ""
  api_base: ""
  temperature: 0.5

tts:
  # mock 会生成本地 WAV 片段，保证无外部 key 时 demo 可跑通。
  # 正式节目推荐 doubao_bigtts；密钥只通过本地设置或环境变量提供。
  engine: "mock"
  voice_mapping:
    Host A: "zh-CN-XiaoxiaoNeural"
  default_voice: "zh-CN-XiaoxiaoNeural"
  output_dir: "out/voice_segments"
  output_format: "wav"
  rate: "+0%"
  volume: "+0%"
  # 表演导演的基础角色描述；句级意图、情绪、重点和上下文由 production_plan v2 提供。
  performance_prompt: "自然、可信的中文新闻播客主播"
  # 正式发布前为专名、数字和英文缩写提供确定读法；未覆盖项会进入发音复核清单。
  pronunciation_overrides:
    AI: "A I"
    GDP: "G D P"
  # Azure Speech（engine: azure_speech）
  azure_speech_key: ""
  azure_speech_region: ""
  # 独立部署的 CosyVoice HTTP 服务（engine: cosyvoice）
  cosyvoice_endpoint: ""

audio_postprocess:
  output_dir: "out/episodes"
  output_format: "mp3"
  final_basename: "final"
  segment_pause_ms: 600
  normalize_loudness: true
  target_lufs: -16.0
  true_peak_db: -1.0
  sample_rate_hz: 48000
  mp3_bitrate: "128k"
  trim_silence: false
  add_bgm: false

assets:
  output_dir: "out/assets"
  generate_cover: true
  cover_size: [1400, 1400]

publish:
  local_base_dir: "dist/episodes"
  rss_output_dir: "out/rss"
  public_base_url: ""
  podcast_title: "PodFlow 晨报"
  podcast_description: "每天 6 条快讯和 1 条重点解读，保留来源与判断边界。"
  podcast_author: "PodFlow Studio"
  podcast_language: "zh-CN"
  podcast_category: "News"
